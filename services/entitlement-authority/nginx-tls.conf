server {
    listen 46.62.191.13:443 ssl http2;
    listen [2a01:4f9:3090:1eab::2]:443 ssl http2;
    server_name license.selectpilot.app;

    ssl_certificate /etc/letsencrypt/live/license.selectpilot.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/license.selectpilot.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 256k;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header X-Powered-By;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
    }
}
